version: "3.8"

services:
  ganache:
    image: trufflesuite/ganache-cli:latest
    command:
      - --accounts=10
      - --defaultBalanceEther=1000
      - --mnemonic="test test test test test test test test test test test junk"
      - --host=0.0.0.0
      - --port=8545
    ports:
      - "8545:8545"
    networks:
      - blockchain-net

networks:
  blockchain-net:
    driver: bridge
