spring:
  application:
    name: auth-service
  liquibase:
    url: jdbc:postgresql://postgres:5432/auth
    user: auth_liquibase
    password: auth_liquibase
    test-rollback-on-update: on
  datasource:
    url: jdbc:postgresql://postgres:5432/auth
    username: auth
    password: auth

grpc:
  client:
    voting-client:
      address: static://voting-service:9090
      negotiation-type: plaintext
  server:
    port: 9090

jwt:
  secret: my-very-secure-secret-key-that-is-long-enough
  timeout-millis: 3600000

server:
  port: 8080
