version: "3.8"

services:
  postgres:
    image: postgres:15.7
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - voting-net

  ganache:
    image: trufflesuite/ganache-cli:latest
    command:
      - --accounts=10
      - --defaultBalanceEther=1000
      - --mnemonic="test test test test test test test test test test test junk"
      - --host=0.0.0.0
      - --port=8545
      - --networkId=1
      - --chainId=1
      - --gasLimit=8000000
    ports:
      - "8545:8545"
    networks:
      - voting-net
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8545" ]
      interval: 5s
      timeout: 2s
      retries: 12

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
      - "9091:9090"
    depends_on:
      - postgres
    volumes:
      - gradle-cache:/root/.gradle
    networks:
      - voting-net

  blockchain-service:
    build:
      context: ../blockchain-service
      dockerfile: Dockerfile
      args:
        - GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
    ports:
      - "9093:9090"
    environment:
      - WEB3J_ENS_ENABLED=false
      - JAVA_TOOL_OPTIONS=-Dorg.web3j.ens.enabled=false
    depends_on:
      ganache:
        condition: service_healthy
    volumes:
      - gradle-cache:/root/.gradle
    networks:
      - voting-net

  crypto-service:
    build:
      context: ../crypto-service
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
      - "9094:9090"
    depends_on:
      - blockchain-service
    volumes:
      - gradle-cache:/root/.gradle
    networks:
      - voting-net

  voting-service:
    build:
      context: ../voting-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
      - "9092:9090"
    depends_on:
      - auth-service
      - blockchain-service
      - crypto-service
    volumes:
      - gradle-cache:/root/.gradle
    networks:
      - voting-net

  envoy:
    image: envoyproxy/envoy:v1.25.0
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "debug"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - voting-net
    depends_on:
      - auth-service
      - voting-service
      - blockchain-service
      - crypto-service

  ui:
    build:
      context: ../ui/voting-system
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - envoy
    networks:
      - voting-net

networks:
  voting-net:
    driver: bridge

volumes:
  postgres-data:
  gradle-cache:
